<!-- フォントの読み込み -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Imperial+Script&display=swap" rel="stylesheet">

<style>
  :root { --gold: #D4AF37; --glass-black: rgba(0, 0, 0, 0.75); }
  
  .imperial-header {
    position: fixed; top: 0; left: 0; width: 100%; height: 70px;
    background: var(--glass-black); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--gold);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px; box-sizing: border-box; z-index: 1000;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    color: var(--gold); font-family: 'Cormorant Garamond', serif;
  }
  .header-hidden { transform: translateY(-100%); }
  
  /* ロゴの設定 */
  .site-logo { font-family: 'Imperial Script', cursive; font-size: 32px; text-decoration: none; color: var(--gold); cursor: pointer; }
  
  /* 検索バーの可変設定 */
  .search-container { position: relative; display: flex; align-items: center; }
  .search-input { 
    width: 0; opacity: 0; transition: width 0.4s, opacity 0.4s;
    background: transparent; border: none; border-bottom: 1px solid var(--gold); color: var(--gold); outline: none;
  }
  .search-container:hover .search-input, .search-container:focus-within .search-input { width: 150px; opacity: 1; padding: 0 5px; }
  
  .nav-group { display: flex; align-items: center; gap: 20px; font-size: 18px; }
  .icon { cursor: pointer; }
</style>

<header class="imperial-header" id="main-header">
  <div class="nav-group">
    <span class="icon" onclick="toggleMenu()">≡</span>
  </div>
  
  <a href="https://efayukacoonar.github.io/" class="site-logo">Efa</a>

  <div class="nav-group">
    <div class="search-container">
      <span class="icon">🔍</span>
      <input type="text" class="search-input" placeholder="Search...">
    </div>
    <span class="icon">👤</span>
  </div>
</header>

<script>
  let lastScrollY = window.scrollY;
  const header = document.getElementById('main-header');

  window.addEventListener('scroll', () => {
    // 下にスクロールで隠し、上にスクロールで表示
    if (window.scrollY > lastScrollY && window.scrollY > 100) {
      header.classList.add('header-hidden');
    } else {
      header.classList.remove('header-hidden');
    }
    lastScrollY = window.scrollY;
  });
</script>
